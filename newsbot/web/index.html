<!doctype html>
<html lang="en">
<head>

<script>window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/";</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>

<style>
  :root {
    --bg: #050302; --panel: rgba(22, 11, 2, .78); --line: rgba(255, 176, 40, .30);
    --text: #fff0d4; --muted: #b58a4c; --accent: #ffb628; --hot: #ff4d2e; --ok: #b6ff5c; --warn: #ffe066;
    --font: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12.5px/1.45 var(--font); overflow: hidden; }
  #globe { position: fixed; inset: 0; }
  .cesium-viewer-bottom { display: none; }
  a { color: var(--accent); }
  /* CRT scanlines + vignette, over everything but never in the way */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 20;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(255,176,40,.035) 2px 3px),
                radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  /* HUD panels: hairline border with bright corner brackets */
  .glass { --c: var(--accent);
    background:
      linear-gradient(var(--c),var(--c)) top left/12px 2px, linear-gradient(var(--c),var(--c)) top left/2px 12px,
      linear-gradient(var(--c),var(--c)) top right/12px 2px, linear-gradient(var(--c),var(--c)) top right/2px 12px,
      linear-gradient(var(--c),var(--c)) bottom left/12px 2px, linear-gradient(var(--c),var(--c)) bottom left/2px 12px,
      linear-gradient(var(--c),var(--c)) bottom right/12px 2px, linear-gradient(var(--c),var(--c)) bottom right/2px 12px,
      var(--panel);
    background-repeat: no-repeat; border: 1px solid var(--line); border-radius: 2px;
    box-shadow: 0 0 20px rgba(255,176,40,.10), inset 0 0 26px rgba(255,176,40,.05);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  #bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px;
    align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 5; }
  #bar > * { pointer-events: auto; }
  .brand { padding: 7px 14px; font-weight: 700; letter-spacing: 2px; color: var(--accent);
    text-shadow: 0 0 10px rgba(255,176,40,.6); }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 10px; letter-spacing: 1.5px;
    text-shadow: none; }
  .live { color: var(--ok); animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .chips { display: flex; gap: 6px; padding: 6px; flex-wrap: wrap; }
  button, .chip { font: inherit; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text);
    background: rgba(255,176,40,.05); border: 1px solid var(--line); border-radius: 2px; padding: 5px 9px; cursor: pointer; }
  button:hover, .chip:hover { background: rgba(255,176,40,.15); border-color: var(--accent); }
  button.on { background: rgba(255,176,40,.18); border-color: var(--accent); color: #fff;
    box-shadow: 0 0 10px rgba(255,176,40,.35); }
  .chip { display: inline-flex; align-items: center; gap: 6px; user-select: none; }
  .chip.off { opacity: .4; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }
  #clock { font-variant-numeric: tabular-nums; color: var(--accent); }

  #side { position: fixed; top: 84px; right: 12px; bottom: 44px; width: 340px; display: flex;
    flex-direction: column; z-index: 4; }
  #side.hidden { display: none; }
  #side h2 { margin: 0; padding: 12px 14px 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 2px; color: var(--accent); font-weight: 600; border-bottom: 1px solid var(--line); }
  #side h2::before { content: "> "; color: var(--hot); }
  #list { overflow-y: auto; padding: 6px 6px 8px; scrollbar-color: var(--line) transparent; }
  .row { padding: 8px; border-left: 2px solid transparent; cursor: pointer; display: grid;
    grid-template-columns: 1fr auto; gap: 2px 8px; }
  .row:hover, .row.sel { background: rgba(255,176,40,.07); border-left-color: var(--accent); }
  .row .n { font-weight: 600; grid-column: 1 / 3; }
  .row .m { color: var(--muted); font-size: 11px; }
  .row .t { font-variant-numeric: tabular-nums; font-size: 11.5px; text-align: right; color: var(--accent); }
  .st { font-size: 10px; padding: 0 5px; border: 1px solid var(--line); letter-spacing: 1px; }
  .st.Go { color: var(--ok); border-color: rgba(57,255,136,.6); }
  .st.TBC { color: var(--warn); border-color: rgba(255,204,0,.6); }

  #card { position: fixed; left: 12px; bottom: 44px; width: 370px; max-height: 55vh; overflow-y: auto;
    padding: 14px; z-index: 4; display: none; }
  #card.show { display: block; }
  #card h3 { margin: 0 34px 4px 0; font-size: 14px; color: #fff; letter-spacing: .5px; }
  #card[data-kind="sat"] h3::before { content: "[ SATELLITE ] "; }
  #card[data-kind="launch"] h3::before { content: "[ LAUNCH ] "; }
  #card[data-kind="area"] h3::before { content: "[ AREA ] "; }
  .sub { margin: 12px 0 4px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--accent);
    font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; }
  .muted { color: var(--muted); font-size: 11px; padding: 4px 0; }
  .news .item { display: block; padding: 6px 0 6px 8px; border-left: 2px solid var(--line); margin: 4px 0;
    text-decoration: none; color: var(--text); }
  .news .item:hover { border-left-color: var(--accent); background: rgba(255,176,40,.06); }
  .news .tt { display: block; font-size: 12px; }
  .news .src { display: block; color: var(--muted); font-size: 10.5px; margin-top: 2px; }
  #card h3::before { content: "[ TARGET ] "; color: var(--hot); font-size: 10px; letter-spacing: 1.5px; display: block; }
  #card .x { position: absolute; top: 10px; right: 10px; padding: 2px 8px; }
  #card img { width: 100%; margin: 8px 0; max-height: 160px; object-fit: cover;
    filter: grayscale(.5) sepia(.7) contrast(1.15) saturate(1.3); border: 1px solid var(--line); }
  #card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 8px 0; }
  #card dt { color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: 1px; padding-top: 1px; }
  #card dd { margin: 0; font-variant-numeric: tabular-nums; }
  #card p { color: #a9d6de; margin: 8px 0; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .links a, .links button { text-decoration: none; padding: 6px 10px; border-radius: 2px; font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--accent);
    background: rgba(255,176,40,.12); color: var(--text); }
  .links a:hover, .links button:hover { box-shadow: 0 0 12px rgba(255,176,40,.5); }

  /* Launch tags pinned above their pad */
  #tags { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .tag { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; padding-bottom: 34px; }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 1px; height: 34px;
    background: linear-gradient(var(--accent), transparent); box-shadow: 0 0 6px var(--accent); }
  .tag .box { padding: 7px 10px; min-width: 160px; max-width: 230px; text-align: center; }
  .tag .nm { font-weight: 600; font-size: 11.5px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: pointer; }
  .tag .cd { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 14px; font-weight: 700;
    text-shadow: 0 0 10px currentColor; }
  .tag a { display: inline-block; margin-top: 3px; font-size: 11px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; }
  .tag .more { color: var(--muted); font-size: 10px; }
  .tag.hot .box { --c: var(--hot); border-color: rgba(255,45,111,.7); animation: pulse 1.6s infinite; }
  .tag.hot::after { background: linear-gradient(var(--hot), transparent); box-shadow: 0 0 6px var(--hot); }
  .tag.hot .cd, .tag.hot a { color: var(--hot); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,45,111,.6); } 70% { box-shadow: 0 0 0 12px rgba(255,45,111,0); } 100% { box-shadow: 0 0 0 0 rgba(255,45,111,0); } }

  #hud { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5; padding: 5px 14px;
    display: flex; gap: 18px; font-size: 11px; white-space: nowrap; color: var(--muted); letter-spacing: .5px; }
  #hud b { color: var(--accent); font-weight: 600; }
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 16px 20px;
    display: none; z-index: 9; max-width: 90vw; text-align: center; }
  #about { position: fixed; right: 12px; top: 64px; font-size: 9.5px; color: var(--muted); z-index: 2; opacity: .7; }

  #menuBtn { display: none; margin-left: auto; padding: 8px 12px; }
  @media (max-width: 720px) {
    #side { top: auto; left: 8px; right: 8px; width: auto; height: 38vh; bottom: 40px; }
    #card { left: 8px; right: 8px; width: auto; bottom: 40px; max-height: 50vh; z-index: 6; }
    #clock, #about, .hud-extra { display: none; }
    .brand small { display: none; }
    #bar { top: 8px; left: 8px; right: 8px; }
    /* Phones: the control rows fold away behind the menu button. */
    #bar > .chips { display: none; }
    body.menu #bar > .chips { display: flex; }
    #menuBtn { display: inline-block; }
  }
</style>

<body>
<div id="globe"></div>
<div id="tags"></div>

<div id="bar">
  <div class="glass brand">ORBITAL//HOLO<small><span class="live">●</span> LIVE · WGS84 · SGP4</small></div>
  <button class="glass" id="menuBtn" aria-label="Controls">☰ Controls</button>
  <div class="glass chips" id="groups"></div>
  <div class="glass chips">
    <button data-speed="1" class="on">1×</button>
    <button data-speed="60">60×</button>
    <button data-speed="600">600×</button>
    <button id="now">Now</button>
    <button id="toggleList" class="on">List</button>
  </div>
  <div class="glass chips" id="layerBar">
    <button data-layer="sats">Sats</button>
    <button data-layer="launches">Launches</button>
    <button data-layer="grid">Grid</button>
    <button data-layer="rings">Rings</button>
    <button data-layer="borders">Borders</button>
    <button data-layer="xray">X-ray</button>
    <button id="viewMode">Real view</button>
  </div>
</div>

<div id="side" class="glass">
  <h2>Upcoming launches</h2>
  <div id="list"></div>
</div>

<div id="card" class="glass"></div>
<div id="msg" class="glass"></div>
<div id="hud" class="glass"><span id="clock">--</span><span id="coords">LAT --.----  LON ---.----</span><span class="hud-extra">WHEEL zoom · MMB pan · RMB rotate · CTRL+RMB tilt · LMB inspect</span><span class="hud-extra" id="stats">OBJ 0 · LAUNCH 0</span></div>
<div id="about">Natural Earth · Esri · CelesTrak · The Space Devs</div>

<script>
"use strict";
const SOON_HOURS = 72;      // launches closer than this get a tag above their pad
const HOT_MINUTES = 60;     // ...and pulse red inside the last hour
const GROUP_COLORS = {
  stations: "#ffffff", visual: "#ffc94a", gnss: "#ff8c1a", "gps-ops": "#ff8c1a",
  galileo: "#ff8c1a", weather: "#ffe9a8", starlink: "#ffd27a", science: "#ff6a3d",
  geo: "#ff4d2e", active: "#c9a46a",
};
const GROUP_NAMES = { stations: "Space stations", visual: "Brightest", gnss: "GNSS",
  weather: "Weather", starlink: "Starlink", science: "Science", geo: "GEO", active: "All active" };

const $ = (id) => document.getElementById(id);
// Phones and tablets get the light path: no bloom post-processing, coarser
// coastlines and no MSAA. Those are the expensive, fragile parts on a
// mobile GPU (the reference project, gods-eye-view, ships bloom off too).
const LOW_POWER = matchMedia("(pointer: coarse)").matches || Math.min(screen.width, screen.height) < 720;
const layers = { sats: true, launches: true, grid: true, rings: true, borders: true, xray: false };
try { Object.assign(layers, JSON.parse(localStorage.getItem("globeLayers") || "{}")); } catch (e) { /* ignore */ }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function showMsg(text) { const m = $("msg"); m.textContent = text; m.style.display = text ? "block" : "none"; }

if (typeof Cesium === "undefined" || typeof satellite === "undefined") {
  showMsg("Couldn't load the 3D engine from the internet. Check this device's connection and reload.");
  throw new Error("libraries missing");
}

// ------------------------------------------------------------------ viewer
// No Cesium ion account needed: the base layer ships with Cesium, and Esri
// imagery is drawn on top. The default terrain is the WGS84 ellipsoid, so the
// globe is flattened at the poles like the real Earth (a = 6378.137 km,
// b = 6356.752 km).
const viewer = new Cesium.Viewer("globe", {
  baseLayer: Cesium.ImageryLayer.fromProviderAsync(
    Cesium.TileMapServiceImageryProvider.fromUrl(Cesium.buildModuleUrl("Assets/Textures/NaturalEarthII"))),
  baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
  navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false, shouldAnimate: true,
  showRenderLoopErrors: false,
  msaaSamples: LOW_POWER ? 1 : 4,
});
viewer.targetFrameRate = LOW_POWER ? 30 : 60;
// If a frame ever throws, Cesium stops rendering for good and shows a red
// error box. Log it and start the render loop again instead; only give up
// (with a readable message) if it keeps failing.
let renderErrors = 0;
viewer.scene.renderError.addEventListener((_scene, err) => {
  console.error("Globe render error", err);
  renderErrors++;
  if (renderErrors <= 30) setTimeout(() => { viewer.useDefaultRenderLoop = true; }, 300);
  else showMsg("The globe keeps failing to draw. Reload the page to try again.");
});
const baseLayer = viewer.imageryLayers.get(0);
const realLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
  url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  maximumLevel: 19, credit: "Esri, Maxar, Earthstar Geographics",
}));
// Hologram view: no imagery at all. A see-through dark globe, continents
// drawn as glowing amber outlines (Natural Earth via world-atlas), a faint
// graticule, a few decorative rings, and bloom so everything bright glows.
const GOLD = Cesium.Color.fromCssColorString("#ffb628");
const HOT = Cesium.Color.fromCssColorString("#ff4d2e");
const scene = viewer.scene;
scene.fog.enabled = true;
const holo = scene.primitives.add(new Cesium.PrimitiveCollection());
const coastLines = holo.add(new Cesium.PolylineCollection());
const gridLines = holo.add(new Cesium.PolylineCollection());
const borderLines = holo.add(new Cesium.PolylineCollection());
const ringLines = holo.add(new Cesium.PolylineCollection());
const glow = (c, p) => Cesium.Material.fromType("PolylineGlow", { color: c, glowPower: p });
const flat = (c) => Cesium.Material.fromType("Color", { color: c });

function addLine(coll, lonlats, width, material, height) {
  if (lonlats.length < 2) return;
  const flatArr = [];
  for (const [lon, lat] of lonlats) flatArr.push(lon, lat, height);
  coll.add({ positions: Cesium.Cartesian3.fromDegreesArrayHeights(flatArr), width, material });
}
function buildGraticule() {
  const m = flat(GOLD.withAlpha(0.16));
  for (let lat = -60; lat <= 60; lat += 30) {
    const pts = []; for (let lon = -180; lon <= 180; lon += 3) pts.push([lon, lat]);
    addLine(gridLines, pts, 1, m, 6000);
  }
  for (let lon = -180; lon < 180; lon += 30) {
    const pts = []; for (let lat = -88; lat <= 88; lat += 2) pts.push([lon, lat]);
    addLine(gridLines, pts, 1, m, 6000);
  }
  // Rings floating around the globe, like a projector's calibration arcs.
  const R = 6378137 * 1.22;
  [[0.35, 0], [1.2, 0.8], [-0.5, 2.1]].forEach(([tilt, spin], i) => {
    const pts = [];
    for (let a = 0; a <= 360; a += 2) {
      const t = Cesium.Math.toRadians(a);
      let x = R * Math.cos(t), y = R * Math.sin(t), z = 0;
      const y2 = y * Math.cos(tilt) - z * Math.sin(tilt), z2 = y * Math.sin(tilt) + z * Math.cos(tilt);
      const x3 = x * Math.cos(spin) - y2 * Math.sin(spin), y3 = x * Math.sin(spin) + y2 * Math.cos(spin);
      pts.push(new Cesium.Cartesian3(x3, y3, z2));
    }
    ringLines.add({ positions: pts, width: i ? 1.5 : 3,
      material: Cesium.Material.fromType("PolylineDash",
        { color: GOLD.withAlpha(i ? 0.35 : 0.55), dashLength: i ? 12 : 28 }) });
  });
}
async function buildContinents() {
  if (typeof topojson === "undefined") return;
  try {
    const base = "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/";
    const [land, countries] = await Promise.all([
      fetch(base + (LOW_POWER ? "land-110m.json" : "land-50m.json")).then(r => r.json()),
      fetch(base + "countries-110m.json").then(r => r.json())]);
    const coast = topojson.mesh(land, land.objects.land);
    const borders = topojson.mesh(countries, countries.objects.countries, (a, b) => a !== b);
    const coastMat = glow(GOLD.withAlpha(0.9), 0.2);
    for (const line of coast.coordinates) addLine(coastLines, line, 2.5, coastMat, 3000);
    const borderMat = flat(GOLD.withAlpha(0.4));
    for (const line of borders.coordinates) addLine(borderLines, line, 1, borderMat, 3000);
    countryFeatures = topojson.feature(countries, countries.objects.countries).features;
  } catch (e) { console.warn("continent outlines", e); }
}
buildGraticule();
buildContinents();

const bloom = scene.postProcessStages.bloom;
bloom.uniforms.contrast = 128; bloom.uniforms.brightness = -0.45;
bloom.uniforms.delta = 1.0; bloom.uniforms.sigma = 3.2; bloom.uniforms.stepSize = 1.0;
bloom.uniforms.glowOnly = false;

function applyMode(mode) {
  const on = mode !== "real";
  realLayer.show = !on; baseLayer.show = !on;
  holo.show = on;
  const g = scene.globe;
  g.baseColor = on ? Cesium.Color.fromCssColorString("#1c0e02") : Cesium.Color.BLUE;
  // Translucency is only switched on for X-ray: a near-opaque translucent
  // globe costs a second globe pass for nothing.
  g.translucency.enabled = on && layers.xray;
  g.translucency.frontFaceAlpha = 0.72;
  g.translucency.backFaceAlpha = 0.25;
  g.enableLighting = !on;                       // real day/night terminator
  g.showGroundAtmosphere = !on;
  scene.skyAtmosphere.show = !on;
  scene.skyBox.show = !on;
  scene.backgroundColor = Cesium.Color.fromCssColorString("#050302");
  scene.sun.show = !on; scene.moon.show = !on;
  bloom.enabled = on && !LOW_POWER;
  $("viewMode").textContent = on ? "Real view" : "Holo view";
  try { localStorage.setItem("globeMode", on ? "holo" : "real"); } catch (e) { /* private mode */ }
}
let savedMode = "holo";
try { savedMode = localStorage.getItem("globeMode") || "holo"; } catch (e) { /* ignore */ }
applyMode(savedMode);
$("viewMode").onclick = () => applyMode($("viewMode").textContent.startsWith("Real") ? "real" : "holo");
scene.screenSpaceCameraController.minimumZoomDistance = 200;
scene.screenSpaceCameraController.maximumZoomDistance = 2.0e8;   // far enough to see GEO
viewer.clock.clockStep = Cesium.ClockStep.SYSTEM_CLOCK_MULTIPLIER;
viewer.clock.currentTime = Cesium.JulianDate.now();
viewer.clock.multiplier = 1;
viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(5, 30, 2.6e7) });

const clockDate = () => Cesium.JulianDate.toDate(viewer.clock.currentTime);

// -------------------------------------------------------------- satellites
const points = scene.primitives.add(new Cesium.PointPrimitiveCollection());
let sats = [];
const hiddenGroups = new Set(["starlink", "active"]);   // thousands of dots; opt in
let selectedSat = null, followEntity = null, orbit = null;

// SGP4 in a try/catch, geodetic out, every number checked. satellite.js
// signals failure three ways - a thrown error, position === false, and
// satrec.error set with garbage numbers - and a single NaN reaching Cesium
// kills the render loop ("Invalid array length"). Pattern from
// gods-eye-view's propagatePosition().
function satEcf(sat, date) {
  try {
    const pv = satellite.propagate(sat.satrec, date);
    if (!pv || !pv.position || typeof pv.position === "boolean" || sat.satrec.error) return null;
    const gmst = satellite.gstime(date);
    const ecf = satellite.eciToEcf(pv.position, gmst);
    const r = Math.hypot(ecf.x, ecf.y, ecf.z);
    if (!Number.isFinite(r) || r < 6400 || r > 500000) return null;   // km: inside Earth or absurd
    const vel = pv.velocity && typeof pv.velocity !== "boolean" ? pv.velocity : { x: 0, y: 0, z: 0 };
    return { ecf, eci: pv.position, vel, gmst };
  } catch (e) {
    return null;
  }
}
function toCart(ecf, result) {
  return Cesium.Cartesian3.fromElements(ecf.x * 1000, ecf.y * 1000, ecf.z * 1000, result);
}

async function loadSatellites() {
  let data;
  try { data = await (await fetch("/api/satellites", { cache: "no-store" })).json(); }
  catch (e) { console.warn("satellites", e); return; }
  points.removeAll();
  sats = [];
  const chips = $("groups");
  chips.replaceChildren();
  const now = clockDate();
  for (const [group, list] of Object.entries(data.groups || {})) {
    const color = Cesium.Color.fromCssColorString(GROUP_COLORS[group] || "#b8c4d9");
    const big = group === "stations";
    let count = 0;
    for (const [name, l1, l2] of list) {
      let satrec;
      try { satrec = satellite.twoline2satrec(l1, l2); } catch (e) { continue; }
      if (!satrec || satrec.error) continue;
      const sat = { name, group, satrec, color };
      // A satellite that can't be placed now (decayed, bad fit) is dropped
      // at load rather than carried as a hidden liability.
      const p = satEcf(sat, now);
      if (!p) continue;
      sat.point = points.add({
        position: toCart(p.ecf), color, pixelSize: big ? 8 : 3.5,
        outlineColor: Cesium.Color.BLACK.withAlpha(0.6), outlineWidth: big ? 1.5 : 0.5,
        scaleByDistance: new Cesium.NearFarScalar(1e6, 1.5, 2e7, 0.8),
        show: layers.sats && !hiddenGroups.has(group), id: sat,
      });
      sats.push(sat); count++;
    }
    const chip = el("span", "chip" + (hiddenGroups.has(group) ? " off" : ""));
    const dot = el("span", "dot"); dot.style.background = GROUP_COLORS[group] || "#b8c4d9";
    chip.append(dot, el("span", null, `${GROUP_NAMES[group] || group} ${count}`));
    chip.onclick = () => {
      hiddenGroups.has(group) ? hiddenGroups.delete(group) : hiddenGroups.add(group);
      chip.classList.toggle("off", hiddenGroups.has(group));
      for (const s of sats) if (s.group === group) s.point.show = !hiddenGroups.has(group);
      updateSatellites(true);
    };
    chips.append(chip);
  }
}

// Positions are re-propagated once a second (each upload of the point
// buffer is GPU work - doing it every frame on a phone is what made the
// globe stutter), faster only while time is sped up or one is selected.
let lastSatUpdate = 0;
const scratch = new Cesium.Cartesian3();
function updateSatellites(force) {
  const now = performance.now();
  const every = viewer.clock.multiplier > 1 ? 150 : selectedSat ? 250 : 1000;
  if (!force && now - lastSatUpdate < every) return;
  lastSatUpdate = now;
  const date = clockDate();
  for (const s of sats) {
    if (!s.point.show) continue;
    const p = satEcf(s, date);
    if (p) { s.point.position = toCart(p.ecf, scratch); s.point.color = s.color; }
    else s.point.color = Cesium.Color.TRANSPARENT;       // position left where it was
  }
}

// The selected orbit is one Primitive, built synchronously ONCE and then
// turned with the Earth through its modelMatrix - no geometry rebuilds, no
// flicker. Bright where the orbit is in front of the globe, dim behind it.
// This is gods-eye-view's ring approach.
function drawOrbit(sat) {
  removeOrbit();
  const bake = clockDate();
  const periodMin = (2 * Math.PI) / sat.satrec.no;
  const gmst = satellite.gstime(bake);
  const pts = [];
  for (let i = 0; i <= 180; i++) {
    const t = new Date(bake.getTime() + (i / 180) * periodMin * 60000);
    try {
      const pv = satellite.propagate(sat.satrec, t);
      if (!pv || !pv.position || typeof pv.position === "boolean") continue;
      const e = satellite.eciToEcf(pv.position, gmst);   // fixed GMST: the ring closes
      if ([e.x, e.y, e.z].every(Number.isFinite)) pts.push(toCart(e));
    } catch (err) { /* skip this step */ }
  }
  if (pts.length < 2) return;
  const primitive = new Cesium.Primitive({
    geometryInstances: new Cesium.GeometryInstance({
      geometry: new Cesium.PolylineGeometry({ positions: pts, width: 2.5,
        arcType: Cesium.ArcType.NONE, vertexFormat: Cesium.PolylineColorAppearance.VERTEX_FORMAT }),
      attributes: {
        color: Cesium.ColorGeometryInstanceAttribute.fromColor(sat.color.withAlpha(0.9)),
        depthFailColor: Cesium.ColorGeometryInstanceAttribute.fromColor(sat.color.withAlpha(0.25)),
      },
    }),
    appearance: new Cesium.PolylineColorAppearance({ translucent: true }),
    depthFailAppearance: new Cesium.PolylineColorAppearance({ translucent: true }),
    asynchronous: false, allowPicking: false,
  });
  scene.primitives.add(primitive);
  orbit = { primitive, gmstAtBake: gmst, lastTurn: 0 };
}
function turnOrbit() {
  if (!orbit || performance.now() - orbit.lastTurn < 500) return;
  orbit.lastTurn = performance.now();
  const d = satellite.gstime(clockDate()) - orbit.gmstAtBake;
  Cesium.Matrix4.fromRotationTranslation(Cesium.Matrix3.fromRotationZ(-d), Cesium.Cartesian3.ZERO,
    orbit.primitive.modelMatrix);
}
function removeOrbit() {
  if (orbit) { scene.primitives.remove(orbit.primitive); orbit = null; }
}

function selectSat(sat) {
  selectedSat = sat; selectedLaunch = null;
  drawOrbit(sat);
  renderSatCard();
}
function clearSelection() {
  selectedSat = null; selectedLaunch = null;
  if (areaMarker) { viewer.entities.remove(areaMarker); areaMarker = null; }
  removeOrbit();
  unfollow();
  $("card").classList.remove("show");
  document.querySelectorAll(".row.sel").forEach(r => r.classList.remove("sel"));
}
function follow(sat) {
  unfollow();
  followEntity = viewer.entities.add({
    position: new Cesium.CallbackProperty((time) => {
      const p = satEcf(sat, Cesium.JulianDate.toDate(time));
      return p ? toCart(p.ecf) : undefined;
    }, false),
    point: { pixelSize: 1, color: Cesium.Color.TRANSPARENT },
    viewFrom: new Cesium.Cartesian3(-2.5e6, -2.5e6, 1.5e6),
  });
  viewer.trackedEntity = followEntity;
}
function unfollow() {
  viewer.trackedEntity = undefined;
  if (followEntity) { viewer.entities.remove(followEntity); followEntity = null; }
}

function satQuery(name) {
  const n = name.toUpperCase();
  if (n.startsWith("ISS")) return "International Space Station";
  if (n.includes("TIANHE") || n.startsWith("CSS")) return "Tiangong space station";
  if (n.startsWith("HST")) return "Hubble Space Telescope";
  if (n.startsWith("STARLINK")) return "Starlink satellites";
  if (n.startsWith("GPS") || n.includes("NAVSTAR")) return "GPS satellites";
  if (n.includes("GALILEO")) return "Galileo satellite navigation";
  if (n.startsWith("BEIDOU")) return "BeiDou satellites";
  if (n.includes("GLONASS") || /^COSMOS 2[45]\d\d/.test(n)) return "GLONASS satellites";
  const q = name.replace(/\(.*?\)/g, "").replace(/\s+(DEB|R\/B|AKM|PKM)\b.*$/i, "").trim();
  return q ? `${q} satellite` : name;
}

// Built once per selection; only the moving numbers are refreshed each
// second, so the news list underneath isn't wiped.
function renderSatCard() {
  const s = selectedSat; if (!s) return;
  const card = $("card");
  card.replaceChildren(); card.dataset.kind = "sat";
  const x = el("button", "x", "✕"); x.onclick = clearSelection;
  card.append(x, el("h3", null, s.name));
  const dl = el("dl");
  const add = (k, v, id) => { const dd = el("dd", null, v); if (id) dd.id = id; dl.append(el("dt", null, k), dd); };
  add("Group", GROUP_NAMES[s.group] || s.group);
  add("NORAD ID", s.satrec.satnum);
  add("Altitude", "--", "satAlt");
  add("Speed", "--", "satSpd");
  add("Over", "--", "satOver");
  add("Inclination", `${(s.satrec.inclo * 180 / Math.PI).toFixed(2)}°`);
  add("Period", `${((2 * Math.PI) / s.satrec.no).toFixed(1)} min`);
  add("Eccentricity", s.satrec.ecco.toFixed(5));
  card.append(dl);
  const links = el("div", "links");
  const f = el("button", null, followEntity ? "Stop following" : "Follow");
  f.onclick = () => { followEntity ? unfollow() : follow(s); f.textContent = followEntity ? "Stop following" : "Follow"; };
  const n2yo = el("a", null, "Tracking page");
  n2yo.href = `https://www.n2yo.com/satellite/?s=${encodeURIComponent(s.satrec.satnum)}`;
  n2yo.target = "_blank"; n2yo.rel = "noopener";
  links.append(f, n2yo);
  card.append(links);
  loadNews(card, satQuery(s.name));
  card.classList.add("show");
  updateSatCard();
}
function updateSatCard() {
  const s = selectedSat; if (!s || !$("satAlt")) return;
  const p = satEcf(s, clockDate()); if (!p) return;
  const geo = satellite.eciToGeodetic(p.eci, p.gmst);
  $("satAlt").textContent = `${geo.height.toFixed(0)} km`;
  $("satSpd").textContent = `${Math.hypot(p.vel.x, p.vel.y, p.vel.z).toFixed(2)} km/s`;
  $("satOver").textContent = `${satellite.degreesLat(geo.latitude).toFixed(2)}°, ${satellite.degreesLong(geo.longitude).toFixed(2)}°`;
}

// ------------------------------------------------------------------- news
// Headlines come from the Pi (/api/news), which asks Google News RSS and
// caches the answer - never the GNews allowance the morning digest uses.
function ago(iso) {
  const m = (Date.now() - Date.parse(iso)) / 60000;
  if (!isFinite(m)) return "";
  if (m < 60) return `${Math.max(1, Math.round(m))}m ago`;
  if (m < 48 * 60) return `${Math.round(m / 60)}h ago`;
  return `${Math.round(m / 1440)}d ago`;
}
async function loadNews(container, query, heading) {
  const box = el("div", "news");
  box.append(el("div", "sub", heading || `NEWS // ${query}`));
  const status = el("div", "muted", "Scanning feeds…");
  box.append(status);
  container.append(box);
  try {
    const r = await fetch("/api/news?q=" + encodeURIComponent(query));
    const d = await r.json();
    status.remove();
    if (!d.items || !d.items.length) { box.append(el("div", "muted", "No reporting in the last 3 days.")); return; }
    for (const it of d.items) {
      const a = el("a", "item"); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      a.append(el("span", "tt", it.title), el("span", "src", [it.source, it.published ? ago(it.published) : ""].filter(Boolean).join(" · ")));
      box.append(a);
    }
  } catch (e) { status.textContent = "News feed unreachable."; }
}

// -------------------------------------------------------------- places
// Which country was clicked, worked out in the browser from the same Natural
// Earth outlines the globe draws - no geocoding service involved.
let countryFeatures = [];
function inRing(x, y, ring) {
  let c = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function countryAt(lon, lat) {
  for (const f of countryFeatures) {
    const g = f.geometry; if (!g) continue;
    const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
    for (const p of polys) {
      if (inRing(lon, lat, p[0]) && !p.slice(1).some(h => inRing(lon, lat, h))) return fullName(f.properties.name);
    }
  }
  return null;
}
// Natural Earth's small-scale names are abbreviated ("S. Sudan"); news
// search wants the real name.
function fullName(n) {
  return n.replace("Dem. Rep. Congo", "Democratic Republic of the Congo").replace(/\bFr\. S\./, "French Southern").replace(/\bS\. /, "South ").replace(/\bN\. /, "Northern ")
    .replace(/\bW\. /, "Western ").replace(/\bDem\. /, "Democratic ").replace(/\bRep\./, "Republic")
    .replace(/\bEq\. /, "Equatorial ").replace(/\bIs\./, "Islands").replace(/\bHerz\./, "Herzegovina");
}
function oceanAt(lon, lat) {       // rough, but only used to label open water
  if (lat > 66) return "Arctic Ocean";
  if (lat < -60) return "Southern Ocean";
  if (lon > -70 && lon < 20) return "Atlantic Ocean";
  if (lon >= 20 && lon < 146 && lat < 30) return "Indian Ocean";
  return "Pacific Ocean";
}
let areaMarker = null;
function selectArea(lon, lat) {
  clearSelection();
  const place = countryAt(lon, lat) || oceanAt(lon, lat);
  areaMarker = viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(lon, lat),
    point: { pixelSize: 10, color: GOLD, outlineColor: GOLD.withAlpha(0.3), outlineWidth: 8 } });
  const card = $("card");
  card.replaceChildren(); card.dataset.kind = "area";
  const x = el("button", "x", "✕"); x.onclick = clearSelection;
  card.append(x, el("h3", null, place));
  const dl = el("dl");
  dl.append(el("dt", null, "Position"), el("dd", null,
    `${Math.abs(lat).toFixed(3)}°${lat >= 0 ? "N" : "S"}, ${Math.abs(lon).toFixed(3)}°${lon >= 0 ? "E" : "W"}`));
  const here = launches.filter(l => countryAt(l.lon, l.lat) === place && netMs(l) > clockDate().getTime());
  if (here.length) dl.append(el("dt", null, "Launches"), el("dd", null, `${here.length} upcoming from here`));
  card.append(dl);
  loadNews(card, place);
  card.classList.add("show");
}

// ---------------------------------------------------------------- launches
let launches = [];
let selectedLaunch = null;
const padEntities = new Map();    // pad key -> entity
const tagEls = new Map();         // pad key -> tag element

const pings = scene.primitives.add(new Cesium.PointPrimitiveCollection());
const padKey = (l) => `${l.lat.toFixed(3)},${l.lon.toFixed(3)}`;
const netMs = (l) => Date.parse(l.net);

function countdown(ms) {
  const neg = ms < 0; ms = Math.abs(ms);
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24,
        m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return (neg ? "T+" : "T-") + (d ? `${d}d ` : "") + `${pad(h)}:${pad(m)}:${pad(s)}`;
}
const fmtLocal = (ms) => new Date(ms).toLocaleString([], { weekday: "short", day: "numeric",
  month: "short", hour: "2-digit", minute: "2-digit" });

function linkFor(l) {
  const a = el("a", null, l.stream_url ? "▶ Watch live" : "Launch page ↗");
  a.href = l.stream_url || l.info_url; a.target = "_blank"; a.rel = "noopener";
  return a;
}
function gcalLink(l) {
  const t = (ms) => new Date(ms).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const start = netMs(l);
  const p = new URLSearchParams({ action: "TEMPLATE", text: `🚀 ${l.name}`,
    dates: `${t(start)}/${t(start + 3600e3)}`,
    details: `${l.rocket} · ${l.provider}\n${l.stream_url || l.info_url}`,
    location: [l.pad, l.location].filter(Boolean).join(", ") });
  return "https://calendar.google.com/calendar/render?" + p;
}

async function loadLaunches() {
  let data;
  try { data = await (await fetch("/api/launches", { cache: "no-store" })).json(); }
  catch (e) { console.warn("launches", e); return; }
  launches = (data.launches || []).filter(l => isFinite(l.lat) && isFinite(l.lon));
  for (const e of padEntities.values()) viewer.entities.remove(e);
  pings.removeAll();
  padEntities.clear();
  for (const t of tagEls.values()) t.remove();
  tagEls.clear();

  const byPad = new Map();
  for (const l of launches) {
    const k = padKey(l);
    if (!byPad.has(k)) byPad.set(k, []);
    byPad.get(k).push(l);
  }
  for (const [k, list] of byPad) {
    list.sort((a, b) => netMs(a) - netMs(b));
    const ent = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(list[0].lon, list[0].lat, 0),
      point: { pixelSize: 8, color: HOT, outlineColor: HOT.withAlpha(0.35), outlineWidth: 5 },
    });
    // Radar ping for pads with a launch in the next 72 hours: a screen-space
    // ring whose size and fade are uniforms. (An animated ellipse entity
    // rebuilt its geometry every single frame.)
    ent.ping = pings.add({ position: Cesium.Cartesian3.fromDegrees(list[0].lon, list[0].lat, 0),
      pixelSize: 10, color: Cesium.Color.TRANSPARENT, outlineColor: HOT.withAlpha(0), outlineWidth: 2, show: false });
    ent.padLaunches = list;
    ent.show = layers.launches;
    padEntities.set(k, ent);
  }
  renderList();
  if (!window.__deepLinked) {
    window.__deepLinked = true;
    const m = location.hash.match(/launch=([^&]+)/);
    if (m) { const l = launches.find(x => x.id === decodeURIComponent(m[1])); if (l) selectLaunch(l, true); }
  }
}

function renderList() {
  const list = $("list");
  list.replaceChildren();
  const now = clockDate().getTime();
  const upcoming = launches.filter(l => netMs(l) > now - 3600e3);
  if (!upcoming.length) { list.append(el("div", "row", "No launch data yet - the Pi fetches it every 20 minutes.")); return; }
  for (const l of upcoming) {
    const r = el("div", "row" + (selectedLaunch && selectedLaunch.id === l.id ? " sel" : ""));
    r.append(el("div", "n", l.name));
    const meta = el("div", "m", `${fmtLocal(netMs(l))} · ${l.location || l.pad}`);
    const right = el("div", "t");
    right.dataset.net = l.net;
    right.textContent = countdown(netMs(l) - now);
    r.append(meta, right);
    if (l.status) { const st = el("span", "st " + l.status, l.status); meta.prepend(st, " "); }
    r.onclick = () => selectLaunch(l, true);
    list.append(r);
  }
}

function selectLaunch(l, fly) {
  selectedSat = null; unfollow();
  removeOrbit();
  selectedLaunch = l;
  if (fly) viewer.camera.flyToBoundingSphere(
    new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(l.lon, l.lat, 0), 1),
    { offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-50), 4.0e6), duration: 2.2 });
  const card = $("card");
  if (areaMarker) { viewer.entities.remove(areaMarker); areaMarker = null; }
  card.replaceChildren(); card.dataset.kind = "launch";
  const x = el("button", "x", "✕"); x.onclick = clearSelection;
  card.append(x, el("h3", null, l.name));
  if (l.image) { const img = el("img"); img.src = l.image; img.alt = ""; img.onerror = () => img.remove(); card.append(img); }
  const dl = el("dl");
  const add = (k, v) => { if (v) dl.append(el("dt", null, k), el("dd", null, v)); };
  const cd = el("dd", null, ""); cd.dataset.net = l.net;
  dl.append(el("dt", null, "Countdown"), cd);
  add("Liftoff", `${fmtLocal(netMs(l))} (${new Date(netMs(l)).toISOString().slice(11, 16)} UTC)`);
  add("Status", l.status_name || l.status);
  add("Rocket", l.rocket);
  add("Provider", l.provider);
  add("Orbit", l.orbit);
  add("Pad", [l.pad, l.location].filter(Boolean).join(", "));
  card.append(dl);
  if (l.mission) card.append(el("p", null, l.mission));
  const links = el("div", "links");
  links.append(linkFor(l));
  if (l.stream_url) { const d = el("a", null, "Launch page ↗"); d.href = l.info_url; d.target = "_blank"; d.rel = "noopener"; links.append(d); }
  const gc = el("a", null, "+ Google Calendar"); gc.href = gcalLink(l); gc.target = "_blank"; gc.rel = "noopener"; links.append(gc);
  const ics = el("a", null, "+ .ics"); ics.href = `/calendar/${encodeURIComponent(l.id)}.ics`; links.append(ics);
  const r = l.rocket_info || {};
  if (r.wiki_url) { const w = el("a", null, "Rocket wiki ↗"); w.href = r.wiki_url; w.target = "_blank"; w.rel = "noopener"; links.append(w); }
  card.append(links);
  const rocketName = l.rocket || l.name.split("|")[0].trim();
  if (Object.keys(r).length) {
    card.append(el("div", "sub", `ROCKET // ${rocketName}`));
    const rd = el("dl");
    const put = (k, v) => { if (v !== undefined && v !== null && v !== "") rd.append(el("dt", null, k), el("dd", null, String(v))); };
    const n = (v) => Number(v).toLocaleString();
    put("Maker", r.manufacturer);
    put("Height", r.length_m && `${r.length_m} m`);
    put("Diameter", r.diameter_m && `${r.diameter_m} m`);
    put("Liftoff mass", r.launch_mass_t && `${n(r.launch_mass_t)} t`);
    put("Thrust", r.thrust_kn && `${n(r.thrust_kn)} kN`);
    put("To LEO", r.leo_capacity_kg && `${n(r.leo_capacity_kg)} kg`);
    put("To GTO", r.gto_capacity_kg && `${n(r.gto_capacity_kg)} kg`);
    put("Reusable", r.reusable === undefined ? "" : (r.reusable ? "Yes" : "No"));
    put("First flight", r.maiden_flight);
    if (r.launches != null) put("Record", `${r.successes ?? "?"} of ${r.launches} flights successful`);
    card.append(rd);
    if (r.description) card.append(el("p", null, r.description));
  }
  loadNews(card, rocketName);
  card.classList.add("show");
  renderList();
  history.replaceState(null, "", "#launch=" + encodeURIComponent(l.id));
}

// Tags: HTML cards glued above the pad of every launch within SOON_HOURS,
// hidden when the pad is on the far side of the Earth.
const winPos = new Cesium.Cartesian2();
const toWindow = (Cesium.SceneTransforms.worldToWindowCoordinates || Cesium.SceneTransforms.wgs84ToWindowCoordinates);
function updateTags() {
  const now = clockDate().getTime();
  const occluder = new Cesium.EllipsoidalOccluder(Cesium.Ellipsoid.WGS84, viewer.camera.positionWC);
  for (const [k, ent] of padEntities) {
    const soon = ent.padLaunches.filter(l => {
      const dt = netMs(l) - now; return dt > -3600e3 && dt < SOON_HOURS * 3600e3; });
    ent.soon = soon.length > 0;
    let tag = tagEls.get(k);
    if (!soon.length) { if (tag) { tag.remove(); tagEls.delete(k); } continue; }
    const l = soon[0];
    if (!tag || tag.dataset.id !== l.id) {
      if (tag) tag.remove();
      tag = el("div", "tag");
      tag.dataset.id = l.id;
      const box = el("div", "box glass");
      const nm = el("div", "nm", l.name); nm.title = l.name; nm.onclick = () => selectLaunch(l, true);
      const cdEl = el("div", "cd"); cdEl.dataset.net = l.net;
      box.append(nm, cdEl, linkFor(l));
      if (soon.length > 1) box.append(el("div", "more", `+${soon.length - 1} more from this pad`));
      tag.append(box);
      $("tags").append(tag);
      tagEls.set(k, tag);
    }
    const pos = ent.position.getValue(viewer.clock.currentTime);
    const visible = occluder.isPointVisible(pos) && toWindow(scene, pos, winPos);
    tag.style.display = visible ? "block" : "none";
    if (visible) { tag.style.left = winPos.x + "px"; tag.style.top = winPos.y + "px"; }
    tag.classList.toggle("hot", netMs(l) - now < HOT_MINUTES * 60e3);
  }
}

function tickCountdowns() {
  const now = clockDate().getTime();
  document.querySelectorAll("[data-net]").forEach(e => { e.textContent = countdown(Date.parse(e.dataset.net) - now); });
  const d = clockDate();
  $("clock").textContent = d.toISOString().slice(0, 19).replace("T", " ") + " UTC" +
    (viewer.clock.multiplier !== 1 ? `  ·  ${viewer.clock.multiplier}×` : "");
  updateSatCard();
}

// ------------------------------------------------------------------- wiring
scene.preUpdate.addEventListener(() => {
  const phase = (performance.now() / 2600) % 1;       // one ping every 2.6 s
  const ringColor = HOT.withAlpha(0.8 * (1 - phase));
  for (const e of padEntities.values()) {
    if (!e.ping) continue;
    e.ping.show = !!e.soon && layers.launches;
    if (e.ping.show) { e.ping.pixelSize = 10 + phase * 46; e.ping.outlineColor = ringColor; }
  }
  updateSatellites(false);
  turnOrbit();
});
scene.postRender.addEventListener(updateTags);

new Cesium.ScreenSpaceEventHandler(scene.canvas).setInputAction((click) => {
  const picked = scene.pick(click.position);
  const id = picked && picked.id;
  if (id && id.satrec) return selectSat(id);
  if (id && id.padLaunches) return selectLaunch(id.padLaunches.find(l => netMs(l) > clockDate().getTime() - 3600e3) || id.padLaunches[0], false);
  const c = viewer.camera.pickEllipsoid(click.position, Cesium.Ellipsoid.WGS84);
  if (c) {
    const g = Cesium.Cartographic.fromCartesian(c);
    selectArea(Cesium.Math.toDegrees(g.longitude), Cesium.Math.toDegrees(g.latitude));
  }
}, Cesium.ScreenSpaceEventType.LEFT_CLICK);

// ---------------------------------------------------------------- controls
// Mouse:
//   wheel              zoom (towards the cursor)
//   middle-drag        pan - the ground follows the cursor, like a 2D map
//   right-drag         rotate the globe about its own axis like a desk
//                      globe (sideways) and tip it north/south (up/down),
//                      north stays up
//   Ctrl + right-drag  tilt the view towards the horizon
//   left click         inspect
// Touch: one finger pans, pinch zooms and tilts.
const ctl = scene.screenSpaceCameraController;
const CE = Cesium.CameraEventType;
ctl.rotateEventTypes = [CE.MIDDLE_DRAG];
ctl.tiltEventTypes = [CE.PINCH, { eventType: CE.RIGHT_DRAG, modifier: Cesium.KeyboardEventModifier.CTRL }];
ctl.zoomEventTypes = [CE.WHEEL, CE.PINCH];
ctl.lookEventTypes = [];
ctl.translateEventTypes = [];
const canvas = scene.canvas;
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
// Middle-click would start the browser's autoscroll (Windows) or paste (Linux).
canvas.addEventListener("mousedown", (e) => { if (e.button === 1) e.preventDefault(); });
canvas.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });

let spin = null;                    // right-drag state
canvas.addEventListener("pointerdown", (e) => {
  const touch = e.pointerType === "touch" || e.pointerType === "pen";
  // A mouse's left button is for clicking; a finger has nothing else.
  ctl.rotateEventTypes = touch ? [CE.LEFT_DRAG, CE.MIDDLE_DRAG] : [CE.MIDDLE_DRAG];
  if (e.button === 1 && viewer.trackedEntity) unfollow();
  if (e.button === 2 && !e.ctrlKey && !touch) {
    if (viewer.trackedEntity) unfollow();
    spin = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
  }
}, true);
canvas.addEventListener("pointermove", (e) => {
  if (!spin || e.pointerId !== spin.id) return;
  const dx = e.clientX - spin.x, dy = e.clientY - spin.y;
  spin.x = e.clientX; spin.y = e.clientY;
  // Radians per pixel: a full drag across the screen turns the globe half a
  // turn when zoomed out, proportionally less when close in.
  const h = viewer.camera.positionCartographic.height;
  const k = Math.PI / canvas.clientWidth * Math.min(1, Math.max(0.02, h / 1.2e7));
  // Signs chosen so the globe follows the hand: drag right and the surface
  // moves right, drag down and it moves down.
  viewer.camera.rotate(Cesium.Cartesian3.UNIT_Z, dx * k);    // spin about the poles
  viewer.camera.rotateUp(-dy * k);
  // Stop short of the poles so north never flips.
  if (Math.abs(viewer.camera.positionCartographic.latitude) > Cesium.Math.toRadians(85)) viewer.camera.rotateUp(dy * k);
});
const endSpin = (e) => { if (spin && e.pointerId === spin.id) spin = null; };
canvas.addEventListener("pointerup", endSpin);
canvas.addEventListener("pointercancel", endSpin);

// ------------------------------------------------------------------ layers
function applyLayers() {
  points.show = layers.sats;
  pings.show = layers.launches;
  if (!layers.sats && selectedSat) clearSelection();
  for (const e of padEntities.values()) e.show = layers.launches;
  $("tags").style.display = layers.launches ? "" : "none";
  if (!layers.launches && selectedLaunch) clearSelection();
  // Solid-ish shell by default so the far side doesn't distract; X-ray
  // makes the globe see-through again.
  scene.globe.translucency.enabled = holo.show && layers.xray;
  gridLines.show = layers.grid; ringLines.show = layers.rings; borderLines.show = layers.borders;
  document.querySelectorAll("[data-layer]").forEach(b => b.classList.toggle("on", !!layers[b.dataset.layer]));
  try { localStorage.setItem("globeLayers", JSON.stringify(layers)); } catch (e) { /* ignore */ }
}
document.querySelectorAll("[data-layer]").forEach(b => b.onclick = () => {
  layers[b.dataset.layer] = !layers[b.dataset.layer]; applyLayers();
});
applyLayers();

const handler2 = new Cesium.ScreenSpaceEventHandler(scene.canvas);
handler2.setInputAction((m) => {
  const c = viewer.camera.pickEllipsoid(m.endPosition, Cesium.Ellipsoid.WGS84);
  if (!c) { $("coords").textContent = "LAT --.----  LON ---.----"; return; }
  const g = Cesium.Cartographic.fromCartesian(c);
  const la = Cesium.Math.toDegrees(g.latitude), lo = Cesium.Math.toDegrees(g.longitude);
  $("coords").innerHTML = `LAT <b>${Math.abs(la).toFixed(4)}°${la >= 0 ? "N" : "S"}</b>  LON <b>${Math.abs(lo).toFixed(4)}°${lo >= 0 ? "E" : "W"}</b>`;
}, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
setInterval(() => {
  const shown = sats.filter(s => s.point.show).length;
  const soon = launches.filter(l => { const d = netMs(l) - clockDate().getTime(); return d > 0 && d < 72 * 3600e3; }).length;
  $("stats").innerHTML = `OBJ <b>${shown}</b> · LAUNCH&lt;72H <b>${soon}</b> · UPLINK <b style="color:var(--ok)">OK</b>`;
}, 2000);

document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => {
  viewer.clock.multiplier = Number(b.dataset.speed);
  document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b));
});
$("now").onclick = () => {
  viewer.clock.currentTime = Cesium.JulianDate.now(); viewer.clock.multiplier = 1;
  document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x.dataset.speed === "1"));
};
$("toggleList").onclick = (e) => { $("side").classList.toggle("hidden"); e.target.classList.toggle("on"); };
if (matchMedia("(max-width: 720px)").matches) { $("side").classList.add("hidden"); $("toggleList").classList.remove("on"); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") clearSelection(); });
$("menuBtn").onclick = () => document.body.classList.toggle("menu");

loadSatellites();
loadLaunches();
setInterval(tickCountdowns, 1000);
setInterval(loadLaunches, 5 * 60e3);
setInterval(loadSatellites, 60 * 60e3);
setInterval(renderList, 60e3);
</script>
</body>
</html>
