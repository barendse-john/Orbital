<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Launch Globe</title>
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<script>window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/";</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020409; --panel: rgba(2, 12, 18, .80); --line: rgba(0, 229, 255, .28);
    --text: #d7faff; --muted: #5d9eaa; --accent: #00e5ff; --hot: #ff2d6f; --ok: #39ff88; --warn: #ffcc00;
    --font: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12.5px/1.45 var(--font); overflow: hidden; }
  #globe { position: fixed; inset: 0; }
  .cesium-viewer-bottom { display: none; }
  a { color: var(--accent); }
  /* CRT scanlines + vignette, over everything but never in the way */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 20;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,229,255,.035) 2px 3px),
                radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  /* HUD panels: hairline border with bright corner brackets */
  .glass { --c: var(--accent);
    background:
      linear-gradient(var(--c),var(--c)) top left/12px 2px, linear-gradient(var(--c),var(--c)) top left/2px 12px,
      linear-gradient(var(--c),var(--c)) top right/12px 2px, linear-gradient(var(--c),var(--c)) top right/2px 12px,
      linear-gradient(var(--c),var(--c)) bottom left/12px 2px, linear-gradient(var(--c),var(--c)) bottom left/2px 12px,
      linear-gradient(var(--c),var(--c)) bottom right/12px 2px, linear-gradient(var(--c),var(--c)) bottom right/2px 12px,
      var(--panel);
    background-repeat: no-repeat; border: 1px solid var(--line); border-radius: 2px;
    box-shadow: 0 0 20px rgba(0,229,255,.10), inset 0 0 26px rgba(0,229,255,.05);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  #bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px;
    align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 5; }
  #bar > * { pointer-events: auto; }
  .brand { padding: 7px 14px; font-weight: 700; letter-spacing: 2px; color: var(--accent);
    text-shadow: 0 0 10px rgba(0,229,255,.6); }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 10px; letter-spacing: 1.5px;
    text-shadow: none; }
  .live { color: var(--ok); animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .chips { display: flex; gap: 6px; padding: 6px; flex-wrap: wrap; }
  button, .chip { font: inherit; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text);
    background: rgba(0,229,255,.05); border: 1px solid var(--line); border-radius: 2px; padding: 5px 9px; cursor: pointer; }
  button:hover, .chip:hover { background: rgba(0,229,255,.15); border-color: var(--accent); }
  button.on { background: rgba(0,229,255,.18); border-color: var(--accent); color: #fff;
    box-shadow: 0 0 10px rgba(0,229,255,.35); }
  .chip { display: inline-flex; align-items: center; gap: 6px; user-select: none; }
  .chip.off { opacity: .4; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }
  #clock { padding: 8px 12px; font-variant-numeric: tabular-nums; margin-left: auto; color: var(--accent); }

  #side { position: fixed; top: 84px; right: 12px; bottom: 44px; width: 340px; display: flex;
    flex-direction: column; z-index: 4; }
  #side.hidden { display: none; }
  #side h2 { margin: 0; padding: 12px 14px 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 2px; color: var(--accent); font-weight: 600; border-bottom: 1px solid var(--line); }
  #side h2::before { content: "> "; color: var(--hot); }
  #list { overflow-y: auto; padding: 6px 6px 8px; scrollbar-color: var(--line) transparent; }
  .row { padding: 8px; border-left: 2px solid transparent; cursor: pointer; display: grid;
    grid-template-columns: 1fr auto; gap: 2px 8px; }
  .row:hover, .row.sel { background: rgba(0,229,255,.07); border-left-color: var(--accent); }
  .row .n { font-weight: 600; grid-column: 1 / 3; }
  .row .m { color: var(--muted); font-size: 11px; }
  .row .t { font-variant-numeric: tabular-nums; font-size: 11.5px; text-align: right; color: var(--accent); }
  .st { font-size: 10px; padding: 0 5px; border: 1px solid var(--line); letter-spacing: 1px; }
  .st.Go { color: var(--ok); border-color: rgba(57,255,136,.6); }
  .st.TBC { color: var(--warn); border-color: rgba(255,204,0,.6); }

  #card { position: fixed; left: 12px; bottom: 44px; width: 370px; max-height: 55vh; overflow-y: auto;
    padding: 14px; z-index: 4; display: none; }
  #card.show { display: block; }
  #card h3 { margin: 0 34px 4px 0; font-size: 14px; color: #fff; letter-spacing: .5px; }
  #card h3::before { content: "[ TARGET ] "; color: var(--hot); font-size: 10px; letter-spacing: 1.5px; display: block; }
  #card .x { position: absolute; top: 10px; right: 10px; padding: 2px 8px; }
  #card img { width: 100%; margin: 8px 0; max-height: 160px; object-fit: cover;
    filter: grayscale(.6) contrast(1.15) sepia(.3) hue-rotate(140deg); border: 1px solid var(--line); }
  #card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 8px 0; }
  #card dt { color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: 1px; padding-top: 1px; }
  #card dd { margin: 0; font-variant-numeric: tabular-nums; }
  #card p { color: #a9d6de; margin: 8px 0; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .links a, .links button { text-decoration: none; padding: 6px 10px; border-radius: 2px; font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--accent);
    background: rgba(0,229,255,.12); color: var(--text); }
  .links a:hover, .links button:hover { box-shadow: 0 0 12px rgba(0,229,255,.5); }

  /* Launch tags pinned above their pad */
  #tags { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .tag { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; padding-bottom: 34px; }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 1px; height: 34px;
    background: linear-gradient(var(--accent), transparent); box-shadow: 0 0 6px var(--accent); }
  .tag .box { padding: 7px 10px; min-width: 160px; max-width: 230px; text-align: center; }
  .tag .nm { font-weight: 600; font-size: 11.5px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: pointer; }
  .tag .cd { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 14px; font-weight: 700;
    text-shadow: 0 0 10px currentColor; }
  .tag a { display: inline-block; margin-top: 3px; font-size: 11px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; }
  .tag .more { color: var(--muted); font-size: 10px; }
  .tag.hot .box { --c: var(--hot); border-color: rgba(255,45,111,.7); animation: pulse 1.6s infinite; }
  .tag.hot::after { background: linear-gradient(var(--hot), transparent); box-shadow: 0 0 6px var(--hot); }
  .tag.hot .cd, .tag.hot a { color: var(--hot); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,45,111,.6); } 70% { box-shadow: 0 0 0 12px rgba(255,45,111,0); } 100% { box-shadow: 0 0 0 0 rgba(255,45,111,0); } }

  #hud { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5; padding: 5px 14px;
    display: flex; gap: 18px; font-size: 11px; white-space: nowrap; color: var(--muted); letter-spacing: .5px; }
  #hud b { color: var(--accent); font-weight: 600; }
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 16px 20px;
    display: none; z-index: 9; max-width: 90vw; text-align: center; }
  #about { position: fixed; right: 12px; bottom: 12px; font-size: 9.5px; color: var(--muted); z-index: 2; opacity: .7; }

  @media (max-width: 720px) {
    #side { top: auto; left: 8px; right: 8px; width: auto; height: 38vh; bottom: 40px; }
    #card { left: 8px; right: 8px; width: auto; bottom: 40px; max-height: 50vh; z-index: 6; }
    #clock, #about, .hud-extra { display: none; }
    .brand small { display: none; }
    #bar { top: 8px; left: 8px; right: 8px; }
  }
</style>
</head>
<body>
<div id="globe"></div>
<div id="tags"></div>

<div id="bar">
  <div class="glass brand">ORBITAL//WATCH<small><span class="live">●</span> LIVE · WGS84 · SGP4</small></div>
  <div class="glass chips" id="groups"></div>
  <div class="glass chips">
    <button data-speed="1" class="on">1×</button>
    <button data-speed="60">60×</button>
    <button data-speed="600">600×</button>
    <button id="now">Now</button>
    <button id="toggleList" class="on">Launches</button>
    <button id="viewMode">Real view</button>
  </div>
  <div class="glass" id="clock">--</div>
</div>

<div id="side" class="glass">
  <h2>Upcoming launches</h2>
  <div id="list"></div>
</div>

<div id="card" class="glass"></div>
<div id="msg" class="glass"></div>
<div id="hud" class="glass"><span id="coords">LAT --.----  LON ---.----</span><span class="hud-extra" id="stats">OBJ 0 · LAUNCH 0</span></div>
<div id="about">© OpenStreetMap · CARTO · Esri · CelesTrak · The Space Devs</div>

<script>
"use strict";
const SOON_HOURS = 72;      // launches closer than this get a tag above their pad
const HOT_MINUTES = 60;     // ...and pulse red inside the last hour
const GROUP_COLORS = {
  stations: "#ffcc00", visual: "#00e5ff", gnss: "#39ff88", "gps-ops": "#39ff88",
  galileo: "#39ff88", weather: "#b36bff", starlink: "#e8faff", science: "#ff5cf0",
  geo: "#ff8a3d", active: "#7fa8b3",
};
const GROUP_NAMES = { stations: "Space stations", visual: "Brightest", gnss: "GNSS",
  weather: "Weather", starlink: "Starlink", science: "Science", geo: "GEO", active: "All active" };

const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function showMsg(text) { const m = $("msg"); m.textContent = text; m.style.display = text ? "block" : "none"; }

if (typeof Cesium === "undefined" || typeof satellite === "undefined") {
  showMsg("Couldn't load the 3D engine from the internet. Check this device's connection and reload.");
  throw new Error("libraries missing");
}

// ------------------------------------------------------------------ viewer
// No Cesium ion account needed: the base layer ships with Cesium, and Esri
// imagery is drawn on top. The default terrain is the WGS84 ellipsoid, so the
// globe is flattened at the poles like the real Earth (a = 6378.137 km,
// b = 6356.752 km).
const viewer = new Cesium.Viewer("globe", {
  baseLayer: Cesium.ImageryLayer.fromProviderAsync(
    Cesium.TileMapServiceImageryProvider.fromUrl(Cesium.buildModuleUrl("Assets/Textures/NaturalEarthII"))),
  baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
  navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false, shouldAnimate: true,
});
const baseLayer = viewer.imageryLayers.get(0);
const realLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
  url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  maximumLevel: 19, credit: "Esri, Maxar, Earthstar Geographics",
}));
// Cyber view: CARTO's dark map for coastlines and borders, then a neon
// lat/lon grid on top. If CARTO can't be reached, the darkened base layer
// underneath still gives the same look.
const cyberLayer = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
  url: "https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png",
  subdomains: "abcd", maximumLevel: 18, credit: "© OpenStreetMap contributors © CARTO",
}));
cyberLayer.brightness = 1.9; cyberLayer.contrast = 1.25;
const CYAN = Cesium.Color.fromCssColorString("#00e5ff");
const HOT = Cesium.Color.fromCssColorString("#ff2d6f");
const gridLayer = viewer.imageryLayers.addImageryProvider(new Cesium.GridImageryProvider({
  cells: 4, color: CYAN.withAlpha(0.32), glowColor: CYAN.withAlpha(0.06), glowWidth: 3,
  backgroundColor: Cesium.Color.TRANSPARENT,
}));
const scene = viewer.scene;
scene.globe.baseColor = Cesium.Color.fromCssColorString("#01080d");
scene.fog.enabled = true;

function applyMode(mode) {
  const cyber = mode !== "real";
  realLayer.show = !cyber; cyberLayer.show = cyber; gridLayer.show = cyber;
  baseLayer.brightness = cyber ? 0.4 : 1; baseLayer.saturation = cyber ? 0.35 : 1;
  baseLayer.contrast = cyber ? 1.4 : 1; baseLayer.hue = cyber ? 0.35 : 0;
  scene.globe.enableLighting = !cyber;              // real day/night terminator
  scene.globe.showGroundAtmosphere = !cyber;
  scene.skyAtmosphere.hueShift = cyber ? -0.06 : 0;
  scene.skyAtmosphere.saturationShift = cyber ? 0.4 : 0;
  scene.skyAtmosphere.brightnessShift = cyber ? -0.25 : 0;
  scene.sun.show = !cyber; scene.moon.show = !cyber;
  $("viewMode").textContent = cyber ? "Real view" : "Cyber view";
  try { localStorage.setItem("globeMode", cyber ? "cyber" : "real"); } catch (e) { /* private mode */ }
}
let savedMode = "cyber";
try { savedMode = localStorage.getItem("globeMode") || "cyber"; } catch (e) { /* ignore */ }
applyMode(savedMode);
$("viewMode").onclick = () => applyMode($("viewMode").textContent.startsWith("Real") ? "real" : "cyber");
scene.screenSpaceCameraController.minimumZoomDistance = 200;
scene.screenSpaceCameraController.maximumZoomDistance = 2.0e8;   // far enough to see GEO
viewer.clock.clockStep = Cesium.ClockStep.SYSTEM_CLOCK_MULTIPLIER;
viewer.clock.currentTime = Cesium.JulianDate.now();
viewer.clock.multiplier = 1;
viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(5, 30, 2.6e7) });

const clockDate = () => Cesium.JulianDate.toDate(viewer.clock.currentTime);

// -------------------------------------------------------------- satellites
const points = scene.primitives.add(new Cesium.PointPrimitiveCollection());
const orbitLines = scene.primitives.add(new Cesium.PolylineCollection());
let sats = [];
const hiddenGroups = new Set(["starlink", "active"]);   // thousands of dots; opt in
let selectedSat = null, followEntity = null, orbitEntity = null, lastOrbit = 0;

function satEcf(sat, date) {
  const pv = satellite.propagate(sat.satrec, date);
  if (!pv || !pv.position || typeof pv.position !== "object") return null;
  const gmst = satellite.gstime(date);
  return { ecf: satellite.eciToEcf(pv.position, gmst), eci: pv.position, vel: pv.velocity, gmst };
}
function toCart(ecf, result) {
  return Cesium.Cartesian3.fromElements(ecf.x * 1000, ecf.y * 1000, ecf.z * 1000, result);
}

async function loadSatellites() {
  let data;
  try { data = await (await fetch("/api/satellites", { cache: "no-store" })).json(); }
  catch (e) { console.warn("satellites", e); return; }
  points.removeAll();
  sats = [];
  const chips = $("groups");
  chips.replaceChildren();
  for (const [group, list] of Object.entries(data.groups || {})) {
    const color = Cesium.Color.fromCssColorString(GROUP_COLORS[group] || "#b8c4d9");
    const big = group === "stations";
    let count = 0;
    for (const [name, l1, l2] of list) {
      let satrec;
      try { satrec = satellite.twoline2satrec(l1, l2); } catch (e) { continue; }
      if (!satrec || satrec.error) continue;
      const sat = { name, group, satrec, color };
      sat.point = points.add({
        position: Cesium.Cartesian3.ZERO, color, pixelSize: big ? 8 : 3.5,
        outlineColor: Cesium.Color.BLACK.withAlpha(0.6), outlineWidth: big ? 1.5 : 0.5,
        show: !hiddenGroups.has(group), id: sat,
      });
      sats.push(sat); count++;
    }
    const chip = el("span", "chip" + (hiddenGroups.has(group) ? " off" : ""));
    const dot = el("span", "dot"); dot.style.background = GROUP_COLORS[group] || "#b8c4d9";
    chip.append(dot, el("span", null, `${GROUP_NAMES[group] || group} ${count}`));
    chip.onclick = () => {
      hiddenGroups.has(group) ? hiddenGroups.delete(group) : hiddenGroups.add(group);
      chip.classList.toggle("off", hiddenGroups.has(group));
      for (const s of sats) if (s.group === group) s.point.show = !hiddenGroups.has(group);
    };
    chips.append(chip);
  }
  updateSatellites(true);
}

let lastSatUpdate = 0;
const scratch = new Cesium.Cartesian3();
function updateSatellites(force) {
  const now = performance.now();
  // Propagating every satellite every frame is wasted work at 1x; ~20 Hz is
  // smooth to the eye. Big groups get a slower cadence.
  const every = sats.length > 3000 ? 200 : 50;
  if (!force && now - lastSatUpdate < every) return;
  lastSatUpdate = now;
  const date = clockDate();
  for (const s of sats) {
    if (!s.point.show) continue;
    const p = satEcf(s, date);
    if (p) { s.point.position = toCart(p.ecf, scratch); }
  }
}

function drawOrbit(sat, date) {
  // One full revolution, drawn in the inertial frame and rotated into the
  // Earth frame at the current instant - so it's the closed ellipse the
  // satellite is flying, not a ground track.
  const periodMin = (2 * Math.PI) / sat.satrec.no;
  const gmst = satellite.gstime(date);
  const pts = [];
  const steps = 240;
  for (let i = 0; i <= steps; i++) {
    const t = new Date(date.getTime() + (i / steps) * periodMin * 60000);
    const pv = satellite.propagate(sat.satrec, t);
    if (!pv || !pv.position || typeof pv.position !== "object") continue;
    pts.push(toCart(satellite.eciToEcf(pv.position, gmst)));
  }
  // A PolylineCollection updates synchronously; an Entity polyline rebuilds
  // its geometry on a worker every time and never settled at this rate.
  if (!orbitEntity) {
    orbitEntity = orbitLines.add({ positions: pts, width: 4,
      material: Cesium.Material.fromType("PolylineGlow", { color: sat.color.withAlpha(0.9), glowPower: 0.3 }) });
  } else {
    orbitEntity.positions = pts;
    orbitEntity.material.uniforms.color = sat.color.withAlpha(0.95);
  }
  orbitEntity.show = true;
}

function selectSat(sat) {
  selectedSat = sat; selectedLaunch = null; lastOrbit = 0;
  renderSatCard();
}
function clearSelection() {
  selectedSat = null; selectedLaunch = null;
  if (orbitEntity) orbitEntity.show = false;
  unfollow();
  $("card").classList.remove("show");
  document.querySelectorAll(".row.sel").forEach(r => r.classList.remove("sel"));
}
function follow(sat) {
  unfollow();
  followEntity = viewer.entities.add({
    position: new Cesium.CallbackProperty((time) => {
      const p = satEcf(sat, Cesium.JulianDate.toDate(time));
      return p ? toCart(p.ecf) : undefined;
    }, false),
    point: { pixelSize: 1, color: Cesium.Color.TRANSPARENT },
    viewFrom: new Cesium.Cartesian3(-2.5e6, -2.5e6, 1.5e6),
  });
  viewer.trackedEntity = followEntity;
}
function unfollow() {
  viewer.trackedEntity = undefined;
  if (followEntity) { viewer.entities.remove(followEntity); followEntity = null; }
}

function renderSatCard() {
  const s = selectedSat; if (!s) return;
  const date = clockDate();
  const p = satEcf(s, date);
  const card = $("card");
  card.replaceChildren();
  const x = el("button", "x", "✕"); x.onclick = clearSelection;
  card.append(x, el("h3", null, s.name));
  const dl = el("dl");
  const add = (k, v) => dl.append(el("dt", null, k), el("dd", null, v));
  add("Group", GROUP_NAMES[s.group] || s.group);
  add("NORAD ID", s.satrec.satnum);
  if (p) {
    const geo = satellite.eciToGeodetic(p.eci, p.gmst);
    const v = Math.hypot(p.vel.x, p.vel.y, p.vel.z);
    add("Altitude", `${geo.height.toFixed(0)} km`);
    add("Speed", `${v.toFixed(2)} km/s`);
    add("Over", `${satellite.degreesLat(geo.latitude).toFixed(2)}°, ${satellite.degreesLong(geo.longitude).toFixed(2)}°`);
  }
  add("Inclination", `${(s.satrec.inclo * 180 / Math.PI).toFixed(2)}°`);
  add("Period", `${((2 * Math.PI) / s.satrec.no).toFixed(1)} min`);
  add("Eccentricity", s.satrec.ecco.toFixed(5));
  card.append(dl);
  const links = el("div", "links");
  const f = el("button", null, followEntity ? "Stop following" : "Follow");
  f.onclick = () => { followEntity ? unfollow() : follow(s); renderSatCard(); };
  const n2yo = el("a", null, "Tracking page");
  n2yo.href = `https://www.n2yo.com/satellite/?s=${encodeURIComponent(s.satrec.satnum)}`;
  n2yo.target = "_blank"; n2yo.rel = "noopener";
  links.append(f, n2yo);
  card.append(links);
  card.classList.add("show");
}

// ---------------------------------------------------------------- launches
let launches = [];
let selectedLaunch = null;
const padEntities = new Map();    // pad key -> entity
const tagEls = new Map();         // pad key -> tag element

let pingRadius = 1, pingColor = HOT.withAlpha(0);
const padKey = (l) => `${l.lat.toFixed(3)},${l.lon.toFixed(3)}`;
const netMs = (l) => Date.parse(l.net);

function countdown(ms) {
  const neg = ms < 0; ms = Math.abs(ms);
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24,
        m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return (neg ? "T+" : "T-") + (d ? `${d}d ` : "") + `${pad(h)}:${pad(m)}:${pad(s)}`;
}
const fmtLocal = (ms) => new Date(ms).toLocaleString([], { weekday: "short", day: "numeric",
  month: "short", hour: "2-digit", minute: "2-digit" });

function linkFor(l) {
  const a = el("a", null, l.stream_url ? "▶ Watch live" : "Details ↗");
  a.href = l.stream_url || l.info_url; a.target = "_blank"; a.rel = "noopener";
  return a;
}

async function loadLaunches() {
  let data;
  try { data = await (await fetch("/api/launches", { cache: "no-store" })).json(); }
  catch (e) { console.warn("launches", e); return; }
  launches = (data.launches || []).filter(l => isFinite(l.lat) && isFinite(l.lon));
  for (const e of padEntities.values()) viewer.entities.remove(e);
  padEntities.clear();
  for (const t of tagEls.values()) t.remove();
  tagEls.clear();

  const byPad = new Map();
  for (const l of launches) {
    const k = padKey(l);
    if (!byPad.has(k)) byPad.set(k, []);
    byPad.get(k).push(l);
  }
  for (const [k, list] of byPad) {
    list.sort((a, b) => netMs(a) - netMs(b));
    const ent = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(list[0].lon, list[0].lat, 0),
      point: { pixelSize: 8, color: HOT, outlineColor: HOT.withAlpha(0.35), outlineWidth: 5 },
      // Radar ping around pads with a launch in the next 72 hours.
      ellipse: { semiMajorAxis: new Cesium.CallbackProperty(() => pingRadius, false),
        semiMinorAxis: new Cesium.CallbackProperty(() => pingRadius, false),
        material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(() => pingColor, false)),
        height: 0, show: new Cesium.CallbackProperty(() => !!ent.soon, false) },
    });
    ent.padLaunches = list;
    padEntities.set(k, ent);
  }
  renderList();
  if (!window.__deepLinked) {
    window.__deepLinked = true;
    const m = location.hash.match(/launch=([^&]+)/);
    if (m) { const l = launches.find(x => x.id === decodeURIComponent(m[1])); if (l) selectLaunch(l, true); }
  }
}

function renderList() {
  const list = $("list");
  list.replaceChildren();
  const now = clockDate().getTime();
  const upcoming = launches.filter(l => netMs(l) > now - 3600e3);
  if (!upcoming.length) { list.append(el("div", "row", "No launch data yet - the Pi fetches it every 20 minutes.")); return; }
  for (const l of upcoming) {
    const r = el("div", "row" + (selectedLaunch && selectedLaunch.id === l.id ? " sel" : ""));
    r.append(el("div", "n", l.name));
    const meta = el("div", "m", `${fmtLocal(netMs(l))} · ${l.location || l.pad}`);
    const right = el("div", "t");
    right.dataset.net = l.net;
    right.textContent = countdown(netMs(l) - now);
    r.append(meta, right);
    if (l.status) { const st = el("span", "st " + l.status, l.status); meta.prepend(st, " "); }
    r.onclick = () => selectLaunch(l, true);
    list.append(r);
  }
}

function selectLaunch(l, fly) {
  selectedSat = null; unfollow();
  if (orbitEntity) orbitEntity.show = false;
  selectedLaunch = l;
  if (fly) viewer.camera.flyToBoundingSphere(
    new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(l.lon, l.lat, 0), 1),
    { offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-50), 4.0e6), duration: 2.2 });
  const card = $("card");
  card.replaceChildren();
  const x = el("button", "x", "✕"); x.onclick = clearSelection;
  card.append(x, el("h3", null, l.name));
  if (l.image) { const img = el("img"); img.src = l.image; img.alt = ""; img.onerror = () => img.remove(); card.append(img); }
  const dl = el("dl");
  const add = (k, v) => { if (v) dl.append(el("dt", null, k), el("dd", null, v)); };
  const cd = el("dd", null, ""); cd.dataset.net = l.net;
  dl.append(el("dt", null, "Countdown"), cd);
  add("Liftoff", `${fmtLocal(netMs(l))} (${new Date(netMs(l)).toISOString().slice(11, 16)} UTC)`);
  add("Status", l.status_name || l.status);
  add("Rocket", l.rocket);
  add("Provider", l.provider);
  add("Orbit", l.orbit);
  add("Pad", [l.pad, l.location].filter(Boolean).join(", "));
  card.append(dl);
  if (l.mission) card.append(el("p", null, l.mission));
  const links = el("div", "links");
  links.append(linkFor(l));
  if (l.stream_url) { const d = el("a", null, "Details ↗"); d.href = l.info_url; d.target = "_blank"; d.rel = "noopener"; links.append(d); }
  card.append(links);
  card.classList.add("show");
  renderList();
  history.replaceState(null, "", "#launch=" + encodeURIComponent(l.id));
}

// Tags: HTML cards glued above the pad of every launch within SOON_HOURS,
// hidden when the pad is on the far side of the Earth.
const winPos = new Cesium.Cartesian2();
const toWindow = (Cesium.SceneTransforms.worldToWindowCoordinates || Cesium.SceneTransforms.wgs84ToWindowCoordinates);
function updateTags() {
  const now = clockDate().getTime();
  const occluder = new Cesium.EllipsoidalOccluder(Cesium.Ellipsoid.WGS84, viewer.camera.positionWC);
  for (const [k, ent] of padEntities) {
    const soon = ent.padLaunches.filter(l => {
      const dt = netMs(l) - now; return dt > -3600e3 && dt < SOON_HOURS * 3600e3; });
    ent.soon = soon.length > 0;
    let tag = tagEls.get(k);
    if (!soon.length) { if (tag) { tag.remove(); tagEls.delete(k); } continue; }
    const l = soon[0];
    if (!tag || tag.dataset.id !== l.id) {
      if (tag) tag.remove();
      tag = el("div", "tag");
      tag.dataset.id = l.id;
      const box = el("div", "box glass");
      const nm = el("div", "nm", l.name); nm.title = l.name; nm.onclick = () => selectLaunch(l, true);
      const cdEl = el("div", "cd"); cdEl.dataset.net = l.net;
      box.append(nm, cdEl, linkFor(l));
      if (soon.length > 1) box.append(el("div", "more", `+${soon.length - 1} more from this pad`));
      tag.append(box);
      $("tags").append(tag);
      tagEls.set(k, tag);
    }
    const pos = ent.position.getValue(viewer.clock.currentTime);
    const visible = occluder.isPointVisible(pos) && toWindow(scene, pos, winPos);
    tag.style.display = visible ? "block" : "none";
    if (visible) { tag.style.left = winPos.x + "px"; tag.style.top = winPos.y + "px"; }
    tag.classList.toggle("hot", netMs(l) - now < HOT_MINUTES * 60e3);
  }
}

function tickCountdowns() {
  const now = clockDate().getTime();
  document.querySelectorAll("[data-net]").forEach(e => { e.textContent = countdown(Date.parse(e.dataset.net) - now); });
  const d = clockDate();
  $("clock").textContent = d.toISOString().slice(0, 19).replace("T", " ") + " UTC" +
    (viewer.clock.multiplier !== 1 ? `  ·  ${viewer.clock.multiplier}×` : "");
  if (selectedSat) renderSatCard();
}

// ------------------------------------------------------------------- wiring
scene.preUpdate.addEventListener(() => {
  const phase = (performance.now() / 2600) % 1;       // one ping every 2.6 s
  pingRadius = 15000 + phase * 450000;
  pingColor = HOT.withAlpha(0.4 * (1 - phase));
  updateSatellites(false);
  if (selectedSat && performance.now() - lastOrbit > 2000) { lastOrbit = performance.now(); drawOrbit(selectedSat, clockDate()); }
});
scene.postRender.addEventListener(updateTags);

new Cesium.ScreenSpaceEventHandler(scene.canvas).setInputAction((click) => {
  const picked = scene.pick(click.position);
  const id = picked && picked.id;
  if (id && id.satrec) selectSat(id);
  else if (id && id.padLaunches) selectLaunch(id.padLaunches.find(l => netMs(l) > clockDate().getTime() - 3600e3) || id.padLaunches[0], false);
}, Cesium.ScreenSpaceEventType.LEFT_CLICK);

const handler2 = new Cesium.ScreenSpaceEventHandler(scene.canvas);
handler2.setInputAction((m) => {
  const c = viewer.camera.pickEllipsoid(m.endPosition, Cesium.Ellipsoid.WGS84);
  if (!c) { $("coords").textContent = "LAT --.----  LON ---.----"; return; }
  const g = Cesium.Cartographic.fromCartesian(c);
  const la = Cesium.Math.toDegrees(g.latitude), lo = Cesium.Math.toDegrees(g.longitude);
  $("coords").innerHTML = `LAT <b>${Math.abs(la).toFixed(4)}°${la >= 0 ? "N" : "S"}</b>  LON <b>${Math.abs(lo).toFixed(4)}°${lo >= 0 ? "E" : "W"}</b>`;
}, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
setInterval(() => {
  const shown = sats.filter(s => s.point.show).length;
  const soon = launches.filter(l => { const d = netMs(l) - clockDate().getTime(); return d > 0 && d < 72 * 3600e3; }).length;
  $("stats").innerHTML = `OBJ <b>${shown}</b> · LAUNCH&lt;72H <b>${soon}</b> · UPLINK <b style="color:var(--ok)">OK</b>`;
}, 2000);

document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => {
  viewer.clock.multiplier = Number(b.dataset.speed);
  document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b));
});
$("now").onclick = () => {
  viewer.clock.currentTime = Cesium.JulianDate.now(); viewer.clock.multiplier = 1;
  document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x.dataset.speed === "1"));
};
$("toggleList").onclick = (e) => { $("side").classList.toggle("hidden"); e.target.classList.toggle("on"); };
if (matchMedia("(max-width: 720px)").matches) { $("side").classList.add("hidden"); $("toggleList").classList.remove("on"); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") clearSelection(); });

loadSatellites();
loadLaunches();
setInterval(tickCountdowns, 1000);
setInterval(loadLaunches, 5 * 60e3);
setInterval(loadSatellites, 60 * 60e3);
setInterval(renderList, 60e3);
</script>
</body>
</html>
