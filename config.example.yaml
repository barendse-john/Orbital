# Copy to config.yaml and edit. Secrets live in .env; ${VARS} are read from there.

telegram:
  token: ${TELEGRAM_BOT_TOKEN}
  # Leave both empty and the first person to message the bot automatically
  # becomes its owner (whitelisted + admin) - no editing this file required.
  # Only set these if you want to hand-pick the owner in advance, or you're
  # restoring a bot onto a fresh database and want to skip re-claiming it.
  whitelist: []
  # Admins can run /allow and /deny to add or remove people at runtime.
  admins: []

ai:
  # anthropic | ollama  -- switch freely, restart to apply
  backend: anthropic

  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-haiku-4-5
    max_tokens: 600

  ollama:
    base_url: http://localhost:11434
    model: llama3.2:3b
    # Pi 4/5 with no GPU: keep the model small or summaries will crawl.
    timeout_seconds: 120

news:
  language: en
  country: us
  lookback_hours: 24
  max_articles_per_topic: 5
  # Ceiling across all topics for one digest - picked round-robin so every
  # topic gets a look-in. Keeps the digest to a single Telegram message.
  max_articles_total: 6
  gnews:
    api_key: ${GNEWS_API_KEY}
    daily_quota: 100        # free tier; RSS takes over once this is spent
    # A digest searches every topic at once, so request starts are spaced to
    # stay inside this. The free plan allows 1/s - raise it only if you pay.
    requests_per_second: 1
  rss:
    enabled: true           # Google News RSS: free, no key, no quota
  # The hourly news engine: collects widely, lets the AI score every story
  # for relevance and impact, and builds the briefing from the best ones.
  # Leave this section out to use the defaults (the feeds listed below).
  engine:
    enabled: true
    # Site feeds read every hour on top of your topic searches. Add the
    # sites you actually read; the AI sorts each story into your topics.
    feeds:
      - https://feeds.bbci.co.uk/news/world/rss.xml
      - https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
      - https://feeds.arstechnica.com/arstechnica/index
      - https://spacenews.com/feed/
      - https://www.theverge.com/rss/index.xml
      # New York Times - links open in full if you're signed in on the phone
      - https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
      - https://rss.nytimes.com/services/xml/rss/nyt/World.xml
      - https://rss.nytimes.com/services/xml/rss/nyt/Science.xml
      - https://rss.nytimes.com/services/xml/rss/nyt/Space.xml
      - https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml
    briefing_size: 8        # stories in the morning briefing
    per_topic: 3            # at most this many per topic
    breaking: true          # push major stories as they happen...
    breaking_per_day: 3     # ...but never more than this

digest:
  default_time: "08:00"     # used until a user picks their own
  # Skip sending anything when no topic turned up news
  skip_when_empty: false
  # Show the lead article's picture above the digest. Only works when the
  # article came from GNews (Google News RSS carries no images), so on
  # RSS-only days the digest is quietly text as before.
  lead_image: true

space:
  # Rocket launch reminders and the 3D globe web app.
  enabled: true
  # The globe is served from the Pi on your home network.
  web_host: 0.0.0.0
  web_port: 8080
  # What reminder links point at. Empty = http://<pi hostname>.local:8080
  public_url: ""
  # Remind this many minutes before liftoff (for launches marked Go/TBC).
  remind_before_minutes: [1440, 30]
  # Launch Library 2 free tier: 15 requests/hour. Don't go below 5.
  launch_refresh_minutes: 20
  # CelesTrak groups shown on the globe. Others: starlink (~7000), science,
  # geo, active (~10000 - heavy on a phone).
  satellite_groups: [stations, visual, gnss, weather]
  satellite_refresh_hours: 6
  max_satellites_per_group: 2000

reports:
  # Markdown reports (e.g. a daily briefing a script writes) from a Google Drive
  # folder, read in the Orbital app's Reports tab with a phone notification
  # when one lands. Setup: README, "Optional: reports from Google Drive".
  # Stays off until GDRIVE_REPORTS_FOLDER_ID is set in .env.
  enabled: true
  folder_id: ${GDRIVE_REPORTS_FOLDER_ID}
  service_account_file: ./data/google-service-account.json
  # Telegram user ids who can read them in the app. Empty = the bot's owner
  # (friends you made admin don't).
  chat_ids: []
  poll_minutes: 15
  # Reports already older than this when first seen are listed in the app
  # without a notification, so a fresh install doesn't ring for old ones.
  max_age_hours: 36

database:
  path: ./data/newsbot.db

log_level: INFO
