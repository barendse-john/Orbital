# Copy to config.yaml and edit. Secrets live in .env; ${VARS} are read from there.

telegram:
  token: ${TELEGRAM_BOT_TOKEN}
  # Leave both empty and the first person to message the bot automatically
  # becomes its owner (whitelisted + admin) - no editing this file required.
  # Only set these if you want to hand-pick the owner in advance, or you're
  # restoring a bot onto a fresh database and want to skip re-claiming it.
  whitelist: []
  # Admins can run /allow and /deny to add or remove people at runtime.
  admins: []

ai:
  # anthropic | ollama  -- switch freely, restart to apply
  backend: anthropic

  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-haiku-4-5
    max_tokens: 600

  ollama:
    base_url: http://localhost:11434
    model: llama3.2:3b
    # Pi 4/5 with no GPU: keep the model small or summaries will crawl.
    timeout_seconds: 120

news:
  language: en
  country: us
  lookback_hours: 24
  max_articles_per_topic: 5
  # Ceiling across all topics for one digest - picked round-robin so every
  # topic gets a look-in. Keeps the digest to a single Telegram message.
  max_articles_total: 6
  gnews:
    api_key: ${GNEWS_API_KEY}
    daily_quota: 100        # free tier; RSS takes over once this is spent
    # A digest searches every topic at once, so request starts are spaced to
    # stay inside this. The free plan allows 1/s - raise it only if you pay.
    requests_per_second: 1
  rss:
    enabled: true           # Google News RSS: free, no key, no quota

digest:
  default_time: "08:00"     # used until a user picks their own
  # Skip sending anything when no topic turned up news
  skip_when_empty: false
  # Show the lead article's picture above the digest. Only works when the
  # article came from GNews (Google News RSS carries no images), so on
  # RSS-only days the digest is quietly text as before.
  lead_image: true

database:
  path: ./data/newsbot.db

log_level: INFO
